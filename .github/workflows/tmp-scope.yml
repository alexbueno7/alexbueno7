name: tmp-scope
on: workflow_dispatch
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sI -H "Authorization: Bearer $T" https://api.github.com/user | grep -iE 'x-oauth-scopes|github-authentication-token-expiration' || echo "no scopes header (fine-grained?)"
          curl -s -H "Authorization: Bearer $T" https://api.github.com/graphql -d '{"query":"{user(login:\"alexbueno7\"){contributionsCollection{totalCommitContributions restrictedContributionsCount}}}"}'
        env:
          T: ${{ secrets.PROFILE_TOKEN }}
