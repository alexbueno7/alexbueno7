name: Profile stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # 3D contribution calendar (animated SVG). PROFILE_TOKEN = PAT (repo, read:user)
      # so commit/PR counts include private repos.
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add profile-3d-contrib dist
          git commit -m "chore: update profile stats" && git pull --rebase && git push || true
