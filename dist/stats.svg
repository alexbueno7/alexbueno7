<svg xmlns="http://www.w3.org/2000/svg" width="800" height="160" viewBox="0 0 800 160" role="img" aria-label="Last 12 months: 5592 commits, 148 pull requests, 286 deploys, 47 repositories">
<style>
.v{font:700 40px 'Segoe UI',Ubuntu,sans-serif;text-anchor:middle}
.l{font:600 13px 'Segoe UI',Ubuntu,sans-serif;fill:#8b949e;text-anchor:middle;letter-spacing:2px}
.t{font:600 12px 'Segoe UI',Ubuntu,sans-serif;fill:#8b949e}
.s{opacity:0;animation:up .8s ease-out forwards}
.b{transform-box:fill-box;transform-origin:center;transform:scaleX(0);animation:grow 1s ease-out forwards}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1}}
@keyframes grow{to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.s,.b{animation:none;opacity:1;transform:none}}
</style>
<rect width="800" height="160" rx="10" fill="#0d1117" stroke="#30363d"/>
<text class="t" x="20" y="26">LAST 12 MONTHS · PUBLIC + PRIVATE</text>
<g transform="translate(0,0)"><g class="s" style="animation-delay:0.1s"><text class="v" x="100" y="78" fill="#3fb950">5,592</text><text class="l" x="100" y="108">COMMITS</text><rect x="60" y="122" width="80" height="3" rx="1.5" fill="#3fb950" class="b" style="animation-delay:0.1s"/></g></g>
<g transform="translate(200,0)"><g class="s" style="animation-delay:0.3s"><text class="v" x="100" y="78" fill="#a371f7">148</text><text class="l" x="100" y="108">PULL REQUESTS</text><rect x="60" y="122" width="80" height="3" rx="1.5" fill="#a371f7" class="b" style="animation-delay:0.3s"/></g></g>
<g transform="translate(400,0)"><g class="s" style="animation-delay:0.5s"><text class="v" x="100" y="78" fill="#58a6ff">286</text><text class="l" x="100" y="108">DEPLOYS</text><rect x="60" y="122" width="80" height="3" rx="1.5" fill="#58a6ff" class="b" style="animation-delay:0.5s"/></g></g>
<g transform="translate(600,0)"><g class="s" style="animation-delay:0.7s"><text class="v" x="100" y="78" fill="#f78166">47</text><text class="l" x="100" y="108">REPOSITORIES</text><rect x="60" y="122" width="80" height="3" rx="1.5" fill="#f78166" class="b" style="animation-delay:0.7s"/></g></g>
</svg>
